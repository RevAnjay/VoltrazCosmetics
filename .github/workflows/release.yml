name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Cache BuildTools
        uses: actions/cache@v4
        with:
          path: ~/buildtools
          key: buildtools-${{ runner.os }}-1.21.1-1.21.3-1.21.4-1.21.5

      - name: Install NMS dependencies via BuildTools
        run: |
          mkdir -p ~/buildtools && cd ~/buildtools
          if [ ! -f BuildTools.jar ]; then
            curl -o BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          fi
          
          # v1_21_R1 needs 1.21.1 (paper-server + spigot)
          if ! mvn dependency:get -Dartifact=org.spigotmc:spigot:1.21.1-R0.1-SNAPSHOT:jar:remapped-mojang -q 2>/dev/null; then
            java -jar BuildTools.jar --rev 1.21.1 --remapped
          fi
          
          # v1_21_R2 needs 1.21.3
          if ! mvn dependency:get -Dartifact=org.spigotmc:spigot:1.21.3-R0.1-SNAPSHOT:jar:remapped-mojang -q 2>/dev/null; then
            java -jar BuildTools.jar --rev 1.21.3 --remapped
          fi
          
          # v1_21_R3 needs 1.21.4
          if ! mvn dependency:get -Dartifact=org.spigotmc:spigot:1.21.4-R0.1-SNAPSHOT:jar:remapped-mojang -q 2>/dev/null; then
            java -jar BuildTools.jar --rev 1.21.4 --remapped
          fi
          
          # v1_21_R4 needs 1.21.5
          if ! mvn dependency:get -Dartifact=org.spigotmc:spigot:1.21.5-R0.1-SNAPSHOT:jar:remapped-mojang -q 2>/dev/null; then
            java -jar BuildTools.jar --rev 1.21.5 --remapped
          fi

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: plugin/target/MagicCosmetics-*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
