name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Cache NMS Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: nms-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            nms-${{ runner.os }}-

      - name: Install Paper NMS (v1_21_R1 & v1_21_R5)
        run: |
          mvn paper-nms:init -pl v1_21_R1 -B
          mvn paper-nms:init -pl v1_21_R5 -B

      - name: Install Spigot NMS via BuildTools (v1_21_R2, R3, R4)
        run: |
          mkdir -p ~/buildtools && cd ~/buildtools
          if [ ! -f BuildTools.jar ]; then
            curl -o BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          fi

          for VER in 1.21.3 1.21.4 1.21.5; do
            if [ ! -f ~/.m2/repository/org/spigotmc/spigot/${VER}-R0.1-SNAPSHOT/spigot-${VER}-R0.1-SNAPSHOT-remapped-mojang.jar ]; then
              java -jar BuildTools.jar --rev ${VER} --remapped
            fi
          done

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: plugin/target/VoltrazCosmetics-*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
