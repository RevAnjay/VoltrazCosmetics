name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Cache NMS Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: nms-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            nms-${{ runner.os }}-

      - name: Install Paper Server 1.21.1 (for v1_21_R1 & v1_21_R5)
        run: |
          if [ ! -f ~/.m2/repository/io/papermc/paper/paper-server/1.21.1-R0.1-SNAPSHOT/paper-server-1.21.1-R0.1-SNAPSHOT.jar ]; then
            mkdir -p /tmp/paper-install && cd /tmp/paper-install
            PAPER_BUILD=$(curl -s https://api.papermc.io/v2/projects/paper/versions/1.21.1/builds | python3 -c "import sys,json; builds=json.load(sys.stdin)['builds']; print(builds[-1]['build'])")
            curl -o paper.jar "https://api.papermc.io/v2/projects/paper/versions/1.21.1/builds/${PAPER_BUILD}/downloads/paper-1.21.1-${PAPER_BUILD}.jar"
            java -Dpaperclip.install=true -jar paper.jar
            cd / && rm -rf /tmp/paper-install
          fi

      - name: Install Spigot NMS via BuildTools
        run: |
          mkdir -p ~/buildtools && cd ~/buildtools
          if [ ! -f BuildTools.jar ]; then
            curl -o BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
          fi

          # v1_21_R2 needs 1.21.3
          if [ ! -f ~/.m2/repository/org/spigotmc/spigot/1.21.3-R0.1-SNAPSHOT/spigot-1.21.3-R0.1-SNAPSHOT-remapped-mojang.jar ]; then
            java -jar BuildTools.jar --rev 1.21.3 --remapped
          fi

          # v1_21_R3 needs 1.21.4
          if [ ! -f ~/.m2/repository/org/spigotmc/spigot/1.21.4-R0.1-SNAPSHOT/spigot-1.21.4-R0.1-SNAPSHOT-remapped-mojang.jar ]; then
            java -jar BuildTools.jar --rev 1.21.4 --remapped
          fi

          # v1_21_R4 needs 1.21.5
          if [ ! -f ~/.m2/repository/org/spigotmc/spigot/1.21.5-R0.1-SNAPSHOT/spigot-1.21.5-R0.1-SNAPSHOT-remapped-mojang.jar ]; then
            java -jar BuildTools.jar --rev 1.21.5 --remapped
          fi

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: plugin/target/VoltrazCosmetics-*.jar
          generate_release_notes: true
          draft: false
          prerelease: false
